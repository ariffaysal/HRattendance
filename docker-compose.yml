# PostgreSQL for the Attendance System - run with Docker Desktop:
#   docker compose up -d
#
# The image is built from backend/database/Dockerfile, which copies the init
# SQL into /docker-entrypoint-initdb.d (baking it in avoids Docker Desktop on
# Windows failing to bind-mount a single host file).
#
# Host port is 5434 (not the default 5432) because the machine already runs:
#   - a local PostgreSQL service on 5432
#   - another project's Docker Postgres (footwear_db) on 5433
# The backend reads the matching port from backend/.env (DB_PORT=5434).
# If a port is free on your machine, you may switch back to e.g. "5432:5432"
# and set DB_PORT=5432 in backend/.env instead.
#
# Default credentials match backend/.env.example:
#   host: localhost  port: 5434  db: attendance_db  user: postgres  password: postgres
#
# The schema is created automatically on the FIRST start (empty volume).
# To re-initialize from scratch: docker compose down -v && docker compose up -d

services:
  postgres:
    build: ./backend/database
    image: attendance-postgres:16
    container_name: attendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
